<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Orc Warrior — 3D Battle Axe</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1a1f; }
  body { font-family: "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; }
  #app { position: fixed; inset: 0; }
  canvas { display: block; }

  /* Subtle cinematic vignette */
  .vignette {
    position: fixed; inset: 0; pointer-events: none; z-index: 2;
    background: radial-gradient(ellipse at center, transparent 52%, rgba(0, 0, 0, 0.6) 100%);
  }

  /* White flash overlay used on impact */
  #flash {
    position: fixed; inset: 0; pointer-events: none; opacity: 0; z-index: 3;
    background: radial-gradient(circle at 50% 42%,
      rgba(255, 246, 228, 0.95), rgba(255, 196, 138, 0.35) 45%, transparent 72%);
  }

  /* Title + hint */
  #hud { position: fixed; top: 22px; left: 26px; z-index: 4; pointer-events: none; user-select: none; }
  #hud h1 { font-size: 20px; font-weight: 700; letter-spacing: 0.06em; color: #ede6d6;
            text-shadow: 0 2px 14px rgba(0, 0, 0, 0.85); }
  #hud h1 em { font-style: normal; color: #e0683f; }
  #hud p { margin-top: 6px; font-size: 12.5px; letter-spacing: 0.09em; color: #8f8a7c; }

  /* Attack button */
  #controls { position: fixed; bottom: 36px; left: 50%; transform: translateX(-50%); z-index: 4; }
  #attackBtn {
    pointer-events: auto; cursor: pointer; border: 1px solid #b0402f; border-radius: 12px;
    padding: 15px 54px; font-size: 18px; font-weight: 700; letter-spacing: 0.14em;
    text-transform: uppercase; color: #ffe3d3;
    background: linear-gradient(180deg, #8e2320 0%, #661613 100%);
    box-shadow: 0 0 0 rgba(255, 80, 40, 0), 0 10px 26px rgba(0, 0, 0, 0.55),
                inset 0 1px 0 rgba(255, 255, 255, 0.18);
    transition: transform 120ms ease, box-shadow 220ms ease, filter 220ms ease;
  }
  #attackBtn:hover {
    filter: brightness(1.12);
    box-shadow: 0 0 28px rgba(255, 92, 40, 0.6), 0 10px 26px rgba(0, 0, 0, 0.55),
                inset 0 1px 0 rgba(255, 255, 255, 0.22);
  }
  #attackBtn:active { transform: translateY(2px) scale(0.97); }
</style>
</head>
<body>
<div id="app"></div>
<div class="vignette"></div>
<div id="flash"></div>

<div id="hud">
  <h1>Orc Warrior <em>&mdash;</em> Click to Attack</h1>
  <p>Drag to rotate &middot; Scroll to zoom &middot; Space to strike</p>
</div>

<div id="controls">
  <button id="attackBtn">Attack!</button>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ============================================================
   1. Renderer / scene / camera / controls
   ============================================================ */
const app = document.getElementById('app');

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1a1f);
scene.fog = new THREE.Fog(0x1a1a1f, 9, 24);

const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(2.7, 2.35, 4.7);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.05, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 2.5;
controls.maxDistance = 14;
controls.minPolarAngle = 0.25;
controls.maxPolarAngle = 1.52;
controls.enablePan = false;
controls.update();

/* ============================================================
   2. Lighting
   ============================================================ */
function setupLights() {
  scene.add(new THREE.HemisphereLight(0x9fb8ff, 0x2a2a20, 0.7));

  // Warm key light from the screen's upper-left, casts the main shadow
  const key = new THREE.DirectionalLight(0xffd9a8, 2.8);
  key.position.set(-4.5, 6, 3);
  key.castShadow = true;
  key.shadow.mapSize.set(2048, 2048);
  key.shadow.camera.left = -3;
  key.shadow.camera.right = 3;
  key.shadow.camera.top = 3;
  key.shadow.camera.bottom = -3;
  key.shadow.camera.near = 1;
  key.shadow.camera.far = 20;
  key.shadow.bias = -0.0004;
  key.shadow.normalBias = 0.02;
  scene.add(key);

  // Soft fill from the camera side so the front is not muddy
  const fill = new THREE.DirectionalLight(0x93a7d0, 0.55);
  fill.position.set(4.5, 2.5, 5);
  scene.add(fill);

  // Cool rim light from behind so the orc pops against the dark background
  const rim = new THREE.DirectionalLight(0x6f8dff, 1.2);
  rim.position.set(-2.5, 3.5, -6);
  scene.add(rim);
}

/* ============================================================
   3. Ground
   ============================================================ */
function createGround() {
  const floor = new THREE.Mesh(
    new THREE.CircleGeometry(9, 64),
    new THREE.MeshStandardMaterial({ color: 0x2c3524, roughness: 0.95, metalness: 0 })
  );
  floor.rotation.x = -Math.PI / 2;
  floor.receiveShadow = true;
  scene.add(floor);

  const dais = new THREE.Mesh(
    new THREE.CircleGeometry(3, 48),
    new THREE.MeshStandardMaterial({ color: 0x38422c, roughness: 0.9, metalness: 0 })
  );
  dais.rotation.x = -Math.PI / 2;
  dais.position.y = 0.012;
  dais.receiveShadow = true;
  scene.add(dais);

  const border = new THREE.Mesh(
    new THREE.RingGeometry(3, 3.14, 48),
    new THREE.MeshStandardMaterial({ color: 0x1e2417, roughness: 0.85, metalness: 0 })
  );
  border.rotation.x = -Math.PI / 2;
  border.position.y = 0.015;
  border.receiveShadow = true;
  scene.add(border);
}

/* ============================================================
   4. Shared helpers + materials
   ============================================================ */
function stdMat(color, opts) {
  return new THREE.MeshStandardMaterial(
    Object.assign({ color: color, roughness: 0.85, metalness: 0.05 }, opts || {})
  );
}

function part(geometry, material, x, y, z) {
  const m = new THREE.Mesh(geometry, material);
  m.position.set(x || 0, y || 0, z || 0);
  m.castShadow = true;
  m.receiveShadow = true;
  return m;
}

const MAT = {
  skin: stdMat(0x537f3a, { roughness: 0.85 }),
  skinDark: stdMat(0x43682f, { roughness: 0.9 }),
  mouth: stdMat(0x24100f, { roughness: 1 }),
  tusk: stdMat(0xe6ddc4, { roughness: 0.45 }),
  eye: stdMat(0xf2ede0, { roughness: 0.25 }),
  pupil: stdMat(0x14120f, { roughness: 0.2 }),
  hair: stdMat(0x1d1512, { roughness: 0.95 }),
  leather: stdMat(0x4a3222, { roughness: 0.9 }),
  leatherDark: stdMat(0x33231a, { roughness: 0.9 }),
  bronze: stdMat(0x7a5c33, { roughness: 0.4, metalness: 0.65 }),
  wood: stdMat(0x6b4a2f, { roughness: 0.9 }),
  iron: stdMat(0x8a8f98, { roughness: 0.3, metalness: 0.9 }),
  ironDark: stdMat(0x5a5f66, { roughness: 0.45, metalness: 0.8 })
};

/* ============================================================
   5. Orc character (procedural, hierarchical groups)
   ============================================================ */
let orc, hips, torso, head;
let rightArm, rightElbow, rightHand, leftArm, leftElbow, leftHand;
let rightThigh, rightKnee, leftThigh, leftKnee;
let axeGroup, bladeAnchor;

function buildArm(side) { // side: -1 = right (orc's own right), +1 = left
  const arm = new THREE.Group();
  arm.position.set(0.47 * side, 0.5, 0);

  arm.add(part(new THREE.SphereGeometry(0.155, 18, 14), MAT.skin, 0, -0.02, 0)); // shoulder cap
  arm.add(part(new THREE.CylinderGeometry(0.135, 0.115, 0.42, 14), MAT.skin, 0, -0.21, 0)); // upper arm

  const elbow = new THREE.Group();
  elbow.position.set(0, -0.42, 0);
  elbow.add(part(new THREE.CylinderGeometry(0.115, 0.095, 0.38, 14), MAT.skin, 0, -0.19, 0)); // forearm
  elbow.add(part(new THREE.CylinderGeometry(0.128, 0.112, 0.19, 14), MAT.leather, 0, -0.24, 0)); // bracer

  const hand = new THREE.Group();
  hand.position.set(0, -0.38, 0);
  hand.add(part(new THREE.SphereGeometry(0.105, 14, 12), MAT.skinDark, 0, -0.05, 0)); // fist
  elbow.add(hand);

  arm.add(elbow);
  return { arm: arm, elbow: elbow, hand: hand };
}

function buildLeg(side) {
  const thigh = new THREE.Group();
  thigh.position.set(0.24 * side, 0, 0);

  thigh.add(part(new THREE.SphereGeometry(0.16, 14, 12), MAT.skin, 0, -0.02, 0));
  thigh.add(part(new THREE.CylinderGeometry(0.16, 0.13, 0.44, 14), MAT.skin, 0, -0.24, 0));

  const knee = new THREE.Group();
  knee.position.set(0, -0.46, 0);
  knee.add(part(new THREE.CylinderGeometry(0.125, 0.1, 0.4, 12), MAT.skin, 0, -0.2, 0));
  // boot
  const boot = part(new THREE.BoxGeometry(0.26, 0.16, 0.36), MAT.leatherDark, 0, -0.46, 0.05);
  knee.add(boot);
  const bootTop = part(new THREE.CylinderGeometry(0.135, 0.12, 0.14, 12), MAT.leather, 0, -0.38, 0);
  knee.add(bootTop);

  thigh.add(knee);
  return { thigh: thigh, knee: knee };
}

function createOrc() {
  orc = new THREE.Group();
  orc.name = 'orc';

  hips = new THREE.Group();
  hips.position.set(0, 0.96, 0); // hip pivot, static
  orc.add(hips);

  torso = new THREE.Group();
  torso.position.set(0, 0.96, 0); // animated pivot (lean / twist / breathe)
  orc.add(torso);

  // --- torso mass ---
  torso.add(part(new THREE.BoxGeometry(0.6, 0.32, 0.44), MAT.skin, 0, -0.14, 0));      // abdomen
  torso.add(part(new THREE.BoxGeometry(0.86, 0.62, 0.52), MAT.skin, 0, 0.33, 0));      // chest
  torso.add(part(new THREE.CylinderGeometry(0.11, 0.13, 0.16, 12), MAT.skin, 0, 0.68, 0)); // neck
  // belt (torus flattened to the torso depth) + buckle
  const belt = part(new THREE.TorusGeometry(0.32, 0.05, 12, 32), MAT.leather, 0, -0.05, 0);
  belt.rotation.x = Math.PI / 2;
  belt.scale.y = 0.62;
  torso.add(belt);
  torso.add(part(new THREE.BoxGeometry(0.12, 0.1, 0.06), MAT.bronze, 0, -0.05, 0.23));
  // loincloth flaps
  const front = part(new THREE.BoxGeometry(0.5, 0.34, 0.09), MAT.leatherDark, 0, -0.2, 0.22);
  front.rotation.x = 0.1;
  torso.add(front);
  const back = part(new THREE.BoxGeometry(0.5, 0.34, 0.09), MAT.leatherDark, 0, -0.2, -0.22);
  back.rotation.x = -0.1;
  torso.add(back);
  // crossed chest straps
  const strapA = part(new THREE.BoxGeometry(0.88, 0.09, 0.54), MAT.leather, 0, 0.4, 0.01);
  strapA.rotation.z = 0.42;
  torso.add(strapA);
  const strapB = part(new THREE.BoxGeometry(0.88, 0.09, 0.54), MAT.leather, 0, 0.4, 0.01);
  strapB.rotation.z = -0.42;
  torso.add(strapB);
  // pauldrons (half spheres)
  [-1, 1].forEach(function (s) {
    const pad = part(new THREE.SphereGeometry(0.2, 18, 12, 0, Math.PI * 2, 0, Math.PI / 2), MAT.bronze, 0.5 * s, 0.5, 0);
    pad.scale.set(1.15, 0.85, 1.15);
    torso.add(pad);
  });

  // --- head ---
  head = new THREE.Group();
  head.position.set(0, 0.8, 0);
  const skull = part(new THREE.SphereGeometry(0.25, 20, 16), MAT.skin, 0, 0.02, 0);
  skull.scale.set(1, 1.12, 1.02);
  head.add(skull);
  head.add(part(new THREE.BoxGeometry(0.3, 0.17, 0.17), MAT.skin, 0, -0.13, 0.17));        // snout
  // Open snarl, with a heavy lower lip and exposed upper teeth.
  const mouth = part(new THREE.SphereGeometry(1, 24, 16), MAT.mouth, 0, -0.125, 0.263);
  mouth.scale.set(0.145, 0.055, 0.028);
  head.add(mouth);
  const lowerLip = part(new THREE.SphereGeometry(1, 20, 12), MAT.skinDark, 0, -0.184, 0.266);
  lowerLip.scale.set(0.155, 0.025, 0.046);
  head.add(lowerLip);
  [-0.065, -0.022, 0.022, 0.065].forEach(function (x) {
    const tooth = part(new THREE.BoxGeometry(0.033, 0.024, 0.018), MAT.tusk, x, -0.092, 0.288);
    tooth.rotation.z = -x * 0.7;
    head.add(tooth);
  });
  const brow = part(new THREE.BoxGeometry(0.4, 0.06, 0.14), MAT.skinDark, 0, 0.1, 0.2);    // brow ridge
  brow.rotation.x = -0.3;
  head.add(brow);
  head.add(part(new THREE.BoxGeometry(0.4, 0.045, 0.1), MAT.leatherDark, 0, 0.135, 0.235)); // headband
  [-1, 1].forEach(function (s) {
    // eyes
    const eye = part(new THREE.SphereGeometry(0.055, 14, 12), MAT.eye, 0.095 * s, 0.015, 0.205);
    eye.scale.set(1, 0.85, 0.6);
    head.add(eye);
    head.add(part(new THREE.SphereGeometry(0.026, 10, 8), MAT.pupil, 0.098 * s, 0.012, 0.245));
    // Lower fangs emerge in front of the lip and curve outward toward the tips.
    const tuskGeometry = new THREE.ConeGeometry(0.035, 0.165, 16, 10);
    tuskGeometry.translate(0, 0.0825, 0);
    const positions = tuskGeometry.attributes.position;
    for (let i = 0; i < positions.count; i++) {
      const t = positions.getY(i) / 0.165;
      positions.setX(i, positions.getX(i) + s * 0.028 * t * t);
      positions.setZ(i, positions.getZ(i) + 0.025 * t * t);
    }
    tuskGeometry.computeVertexNormals();
    const tusk = part(tuskGeometry, MAT.tusk, 0.112 * s, -0.18, 0.308);
    head.add(tusk);
    // pointed ears, swept outward and back
    const ear = part(new THREE.ConeGeometry(0.07, 0.28, 10), MAT.skinDark, 0.225 * s, 0.06, -0.01);
    ear.rotation.set(-0.25, 0, -1.1 * s);
    head.add(ear);
  });
  // hair cap + topknot
  const hair = part(new THREE.SphereGeometry(0.235, 18, 12, 0, Math.PI * 2, 0, Math.PI * 0.52), MAT.hair, 0, 0.03, -0.01);
  hair.scale.set(1.05, 1, 1.05);
  head.add(hair);
  head.add(part(new THREE.SphereGeometry(0.075, 12, 10), MAT.hair, 0, 0.3, -0.04));
  head.add(part(new THREE.SphereGeometry(0.05, 12, 10), MAT.skinDark, 0, -0.03, 0.245)); // nose
  torso.add(head);

  // --- legs ---
  const right = buildLeg(-1);
  const left = buildLeg(1);
  rightThigh = right.thigh; rightKnee = right.knee;
  leftThigh = left.thigh; leftKnee = left.knee;
  hips.add(rightThigh, leftThigh);

  // --- arms (right hand carries the axe) ---
  const rArm = buildArm(-1);
  const lArm = buildArm(1);
  rightArm = rArm.arm; rightElbow = rArm.elbow; rightHand = rArm.hand;
  leftArm = lArm.arm; leftElbow = lArm.elbow; leftHand = lArm.hand;
  torso.add(rightArm, leftArm);

  scene.add(orc);
}

/* ============================================================
   6. Battle axe (procedural), attached to the right hand
   ============================================================ */
function crescentBladeGeometry() {
  const s = new THREE.Shape();
  s.moveTo(0, 0.135);
  s.quadraticCurveTo(0.225, 0.112, 0.37, -0.011);
  s.quadraticCurveTo(0.325, -0.213, 0.1, -0.202);
  s.quadraticCurveTo(0.045, -0.112, 0, -0.135);
  s.closePath();
  const g = new THREE.ExtrudeGeometry(s, {
    depth: 0.045, bevelEnabled: true, bevelThickness: 0.008,
    bevelSize: 0.008, bevelSegments: 1, steps: 1
  });
  g.translate(0, 0, -0.0225);
  return g;
}

function createAxe(handGroup) {
  axeGroup = new THREE.Group();

  // handle: butt end hidden inside the forearm, blade end below the fist
  axeGroup.add(part(new THREE.CylinderGeometry(0.03, 0.042, 0.94, 10), MAT.wood, 0, -0.15, 0));
  axeGroup.add(part(new THREE.SphereGeometry(0.045, 10, 8), MAT.leatherDark, 0, 0.32, 0)); // butt cap

  // leather grip wraps around the fist
  [0.09, 0.0, -0.09].forEach(function (y) {
    const ring = part(new THREE.TorusGeometry(0.049, 0.013, 8, 16), MAT.leather, 0, y, 0);
    ring.rotation.x = Math.PI / 2;
    axeGroup.add(ring);
  });

  // axe head
  const headG = new THREE.Group();
  headG.position.set(0, -0.62, 0);
  headG.add(part(new THREE.CylinderGeometry(0.075, 0.075, 0.26, 12), MAT.iron, 0, 0.09, 0)); // collar
  headG.add(part(new THREE.BoxGeometry(0.16, 0.22, 0.1), MAT.ironDark, 0, -0.01, 0));          // socket
  const bladeGeo = crescentBladeGeometry();
  headG.add(part(bladeGeo, MAT.iron, 0.075, 0, 0));                                            // blade A
  const bladeB = part(bladeGeo, MAT.iron, -0.075, 0, 0);                                       // blade B (mirrored)
  bladeB.rotation.y = Math.PI;
  headG.add(bladeB);
  axeGroup.add(headG);

  // anchor used to spawn impact FX at the blade tip
  bladeAnchor = new THREE.Object3D();
  bladeAnchor.position.set(0.06, -0.78, 0);
  axeGroup.add(bladeAnchor);

  // menacing glow near the blade
  const glow = new THREE.PointLight(0xff5a26, 2.4, 3.5, 1.6);
  glow.position.set(0, -0.3, 0.1);
  axeGroup.add(glow);

  handGroup.add(axeGroup);
}

/* ============================================================
   7. UI
   ============================================================ */
const flashEl = document.getElementById('flash');

function setupUI() {
  document.getElementById('attackBtn').addEventListener('click', playAttack);
  window.addEventListener('keydown', function (e) {
    if (e.code === 'Space' || e.code === 'Enter') {
      e.preventDefault();
      playAttack();
    }
  });
}

/* ============================================================
   8. Audio (procedural Web Audio, no files)
   ============================================================ */
let audioCtx = null;

function ensureAudio() {
  if (!audioCtx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    audioCtx = new AC();
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

function noiseBuffer(ctx, dur) {
  const len = Math.max(1, Math.floor(ctx.sampleRate * dur));
  const buf = ctx.createBuffer(1, len, ctx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  return buf;
}

function playWhoosh() {
  const ctx = ensureAudio();
  if (!ctx) return;
  const t = ctx.currentTime;
  const dur = 0.3;
  const src = ctx.createBufferSource();
  src.buffer = noiseBuffer(ctx, dur);
  const bp = ctx.createBiquadFilter();
  bp.type = 'bandpass';
  bp.Q.value = 1.1;
  bp.frequency.setValueAtTime(420, t);
  bp.frequency.exponentialRampToValueAtTime(2400, t + dur * 0.85);
  const g = ctx.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.18, t + 0.06);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  src.connect(bp); bp.connect(g); g.connect(ctx.destination);
  src.start(t); src.stop(t + dur + 0.02);
}

function playThud() {
  const ctx = ensureAudio();
  if (!ctx) return;
  const t = ctx.currentTime;
  const osc = ctx.createOscillator();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(150, t);
  osc.frequency.exponentialRampToValueAtTime(38, t + 0.25);
  const g = ctx.createGain();
  g.gain.setValueAtTime(0.55, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.34);
  osc.connect(g); g.connect(ctx.destination);
  osc.start(t); osc.stop(t + 0.36);

  const src = ctx.createBufferSource();
  src.buffer = noiseBuffer(ctx, 0.09);
  const hp = ctx.createBiquadFilter();
  hp.type = 'highpass';
  hp.frequency.value = 1800;
  const g2 = ctx.createGain();
  g2.gain.setValueAtTime(0.16, t);
  g2.gain.exponentialRampToValueAtTime(0.0001, t + 0.09);
  src.connect(hp); hp.connect(g2); g2.connect(ctx.destination);
  src.start(t); src.stop(t + 0.1);
}

/* ============================================================
   9. Attack animation (manual keyframe tweening, no libraries)
   ============================================================ */
const ATTACK_DURATION = 1.0;
const IMPACT_TIME = 0.55;
const SHAKE_TIME = 0.15;

let attackTime = -1;   // -1 = idle
let impactFired = false;
let elapsed = 0;

const REST_POSE = {
  armX: -0.40, armZ: -0.14, elbowX: -0.35, wristX: -0.22,
  lArmX: -0.06, lArmZ: 0.16, lElbowX: -0.28,
  legX: 0.06, rKneeX: 0.04, lLegX: -0.02,
  torsoX: 0.03, torsoY: 0.0, lean: 0.0
};

// wind-up -> strike -> recovery, driven by the right arm, torso and legs
const SWING = [
  { t: 0.00, armX: -0.40, armZ: -0.14, elbowX: -0.35, wristX: -0.22,
    lArmX: -0.06, lArmZ: 0.16, lElbowX: -0.28,
    legX: 0.06, rKneeX: 0.04, lLegX: -0.02,
    torsoX: 0.03, torsoY: 0.0, lean: 0.0, ease: 'linear' },

  { t: 0.35, armX: 2.60, armZ: -0.62, elbowX: 0.10, wristX: -0.15,
    lArmX: 0.55, lArmZ: 0.50, lElbowX: -0.55,
    legX: 0.34, rKneeX: 0.42, lLegX: -0.12,
    torsoX: -0.20, torsoY: -0.28, lean: -0.09, ease: 'out' },

  { t: 0.55, armX: -0.50, armZ: 0.42, elbowX: -0.06, wristX: 0.35,
    lArmX: -0.40, lArmZ: 0.55, lElbowX: -0.20,
    legX: -0.14, rKneeX: 0.18, lLegX: 0.18,
    torsoX: 0.32, torsoY: 0.30, lean: 0.12, ease: 'in' },

  { t: 1.00, armX: -0.40, armZ: -0.14, elbowX: -0.35, wristX: -0.22,
    lArmX: -0.06, lArmZ: 0.16, lElbowX: -0.28,
    legX: 0.06, rKneeX: 0.04, lLegX: -0.02,
    torsoX: 0.03, torsoY: 0.0, lean: 0.0, ease: 'inout' }
];

function easeFn(name) {
  if (name === 'out') return function (t) { return 1 - Math.pow(1 - t, 3); };
  if (name === 'in') return function (t) { return t * t * t; };
  if (name === 'inout') return function (t) { return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
  return function (t) { return t; };
}

function samplePose(time) {
  const pose = Object.assign({}, REST_POSE);
  for (let i = 1; i < SWING.length; i++) {
    const b = SWING[i];
    if (time > b.t) continue;
    const a = SWING[i - 1];
    const raw = Math.min(1, Math.max(0, (time - a.t) / (b.t - a.t)));
    const k = easeFn(b.ease)(raw);
    for (const key in pose) pose[key] = a[key] + (b[key] - a[key]) * k;
    break;
  }
  return pose;
}

function playAttack() {
  if (attackTime >= 0) return; // guard re-entry
  attackTime = 0;
  impactFired = false;
  playWhoosh();
}

/* --- impact FX: sparks, ring, flash, shake --- */
const SPARK_COUNT = 54;
const sparks = [];
const rings = [];
let impactLight = null;
let impactLightLife = 0;
const shakeOffset = new THREE.Vector3();
let shakeTime = 0;

function spawnSparks(origin) {
  const positions = new Float32Array(SPARK_COUNT * 3);
  const velocities = new Float32Array(SPARK_COUNT * 3);
  for (let i = 0; i < SPARK_COUNT; i++) {
    positions[i * 3] = origin.x;
    positions[i * 3 + 1] = origin.y;
    positions[i * 3 + 2] = origin.z;
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(Math.random() * 1.4 - 0.4);
    const speed = 1.6 + Math.random() * 3.2;
    velocities[i * 3] = Math.sin(phi) * Math.cos(theta) * speed;
    velocities[i * 3 + 1] = Math.abs(Math.cos(phi)) * speed + 1.3;
    velocities[i * 3 + 2] = Math.sin(phi) * Math.sin(theta) * speed;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  const mtl = new THREE.PointsMaterial({
    color: 0xffb066, size: 0.055, transparent: true, opacity: 1,
    depthWrite: false, blending: THREE.AdditiveBlending, sizeAttenuation: true
  });
  const pts = new THREE.Points(geo, mtl);
  scene.add(pts);
  sparks.push({ pts: pts, velocities: velocities, life: 0.5, maxLife: 0.5 });
}

function updateSparks(dt) {
  for (let i = sparks.length - 1; i >= 0; i--) {
    const s = sparks[i];
    const arr = s.pts.geometry.attributes.position.array;
    for (let j = 0; j < SPARK_COUNT; j++) {
      s.velocities[j * 3 + 1] -= 9.5 * dt;
      arr[j * 3] += s.velocities[j * 3] * dt;
      arr[j * 3 + 1] += s.velocities[j * 3 + 1] * dt;
      arr[j * 3 + 2] += s.velocities[j * 3 + 2] * dt;
      if (arr[j * 3 + 1] < 0.02) { // bounce along the ground
        arr[j * 3 + 1] = 0.02;
        s.velocities[j * 3 + 1] *= -0.35;
        s.velocities[j * 3] *= 0.7;
        s.velocities[j * 3 + 2] *= 0.7;
      }
    }
    s.pts.geometry.attributes.position.needsUpdate = true;
    s.life -= dt;
    s.pts.material.opacity = Math.max(0, s.life / s.maxLife);
    if (s.life <= 0) {
      scene.remove(s.pts);
      s.pts.geometry.dispose();
      s.pts.material.dispose();
      sparks.splice(i, 1);
    }
  }
}

function spawnRing(origin) {
  const mesh = new THREE.Mesh(
    new THREE.RingGeometry(0.12, 0.2, 40),
    new THREE.MeshBasicMaterial({
      color: 0xffc27a, transparent: true, opacity: 0.9, side: THREE.DoubleSide,
      depthWrite: false, blending: THREE.AdditiveBlending
    })
  );
  mesh.position.copy(origin);
  scene.add(mesh);
  rings.push({ mesh: mesh, life: 0.45, maxLife: 0.45 });
}

function updateRings(dt) {
  for (let i = rings.length - 1; i >= 0; i--) {
    const r = rings[i];
    r.life -= dt;
    const k = 1 - r.life / r.maxLife;
    r.mesh.scale.setScalar(0.6 + k * 3.4);
    r.mesh.material.opacity = Math.max(0, 1 - k) * 0.9;
    r.mesh.quaternion.copy(camera.quaternion); // billboard
    if (r.life <= 0) {
      scene.remove(r.mesh);
      r.mesh.geometry.dispose();
      r.mesh.material.dispose();
      rings.splice(i, 1);
    }
  }
}

function spawnImpactLight(p) {
  if (!impactLight) {
    impactLight = new THREE.PointLight(0xffa050, 0, 6, 2);
    scene.add(impactLight);
  }
  impactLight.position.copy(p);
  impactLight.intensity = 26;
  impactLightLife = 0.22;
}

function updateImpactLight(dt) {
  if (impactLightLife <= 0) return;
  impactLightLife -= dt;
  impactLight.intensity = Math.max(0, impactLightLife / 0.22) * 26;
}

function updateShake(dt) {
  if (shakeTime <= 0) {
    shakeOffset.set(0, 0, 0);
    return;
  }
  shakeTime -= dt;
  const amp = 0.085 * Math.max(0, shakeTime / SHAKE_TIME);
  shakeOffset.set(
    (Math.random() - 0.5) * amp * 2,
    (Math.random() - 0.5) * amp * 2,
    (Math.random() - 0.5) * amp
  );
}

function screenFlash() {
  flashEl.style.transition = 'none';
  flashEl.style.opacity = '0.55';
  requestAnimationFrame(function () {
    flashEl.style.transition = 'opacity 260ms ease-out';
    flashEl.style.opacity = '0';
  });
}

function triggerImpact() {
  const p = bladeAnchor.getWorldPosition(new THREE.Vector3());
  spawnSparks(p);
  spawnRing(p);
  spawnImpactLight(p);
  shakeTime = SHAKE_TIME;
  screenFlash();
  playThud();
}

/* ============================================================
   10. Pose application + per-frame update
   ============================================================ */
function applyPose(pose, attacking) {
  const breathe = Math.sin(elapsed * 1.6);
  const sway = Math.sin(elapsed * 1.15);
  const damp = attacking ? 0.22 : 1; // idle motion fades out during the swing

  rightArm.rotation.set(pose.armX + breathe * 0.015 * damp, 0, pose.armZ + sway * 0.028 * damp);
  rightElbow.rotation.x = pose.elbowX + Math.sin(elapsed * 1.3 + 1.2) * 0.035 * damp;
  axeGroup.rotation.x = pose.wristX + breathe * 0.02 * damp;

  leftArm.rotation.set(pose.lArmX + breathe * 0.01 * damp, 0, pose.lArmZ - sway * 0.03 * damp);
  leftElbow.rotation.x = pose.lElbowX + Math.sin(elapsed * 1.25 + 2.0) * 0.04 * damp;

  rightThigh.rotation.x = pose.legX;
  rightKnee.rotation.x = pose.rKneeX;
  leftThigh.rotation.x = pose.lLegX;
  leftKnee.rotation.x = pose.rKneeX * 0.4;

  torso.rotation.set(pose.torsoX + breathe * 0.012, pose.torsoY + Math.sin(elapsed * 0.55) * 0.045 * damp, 0);
  torso.scale.y = attacking ? 1 : 1 + breathe * 0.014; // breathing
  orc.rotation.x = pose.lean;
  orc.position.y = attacking ? 0 : breathe * 0.008;

  head.rotation.y = Math.sin(elapsed * 0.45) * 0.11 * damp;
  head.rotation.x = Math.sin(elapsed * 0.8 + 0.5) * 0.04 * damp - (attacking ? 0.06 : 0);
}

function updateAnimation(dt) {
  elapsed += dt;

  let attacking = attackTime >= 0;
  let pose = REST_POSE;

  if (attacking) {
    attackTime += dt;
    if (attackTime >= ATTACK_DURATION) {
      attackTime = -1;
      attacking = false;
    } else {
      pose = samplePose(attackTime);
    }
  }

  if (attacking && !impactFired && attackTime >= IMPACT_TIME) {
    impactFired = true;
    triggerImpact();
  }

  applyPose(pose, attacking);
}

/* ============================================================
   11. Main loop + resize
   ============================================================ */
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);

  updateAnimation(dt);
  updateSparks(dt);
  updateRings(dt);
  updateImpactLight(dt);
  updateShake(dt);

  controls.update();
  camera.position.add(shakeOffset); // positional shake around the orbit controls
  renderer.render(scene, camera);
  camera.position.sub(shakeOffset);
}

window.addEventListener('resize', function () {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

/* ============================================================
   12. Boot
   ============================================================ */
setupLights();
createGround();
createOrc();
createAxe(rightHand);
setupUI();
animate();
</script>
