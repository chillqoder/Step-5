<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Living Glass Aquarium</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #060d13; }
  body { font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  #app { position: fixed; inset: 0; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  #ui {
    position: fixed; left: 14px; bottom: 14px; z-index: 10;
    display: flex; gap: 8px; align-items: center;
  }
  #ui button {
    font: 500 12px/1 ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
    letter-spacing: .04em;
    color: #cfe6ee; background: rgba(10, 26, 34, .55);
    border: 1px solid rgba(140, 200, 220, .22);
    padding: 8px 12px; border-radius: 999px; cursor: pointer;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    transition: background .18s ease, border-color .18s ease, color .18s ease;
  }
  #ui button:hover { background: rgba(20, 48, 60, .75); border-color: rgba(160, 225, 240, .45); color: #eafaff; }
  #ui button:active { transform: translateY(1px); }
  #hint {
    position: fixed; right: 14px; bottom: 16px; z-index: 10;
    font: 400 11px/1.4 ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
    letter-spacing: .06em; color: rgba(190, 220, 232, .42);
    text-align: right; pointer-events: none; transition: opacity 1s ease;
  }
  #loader {
    position: fixed; inset: 0; z-index: 20; display: grid; place-content: center; justify-items: center; gap: 14px;
    background: radial-gradient(120% 100% at 50% 0%, #0d2530 0%, #060d13 70%);
    color: #9fc6d4; font: 500 12px/1 ui-sans-serif, sans-serif; letter-spacing: .18em; text-transform: uppercase;
    transition: opacity .7s ease;
  }
  #loader.hide { opacity: 0; pointer-events: none; }
  .ring { width: 34px; height: 34px; border-radius: 50%; border: 2px solid rgba(140, 210, 230, .18); border-top-color: #7fd8ea; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="app"></div>
<div id="ui">
  <button id="btnReset" type="button">Reset view</button>
  <button id="btnPause" type="button">Pause</button>
</div>
<div id="hint">drag to orbit &middot; scroll / pinch to zoom &middot; right-drag to pan</div>
<div id="loader"><div class="ring"></div><span>building the aquarium</span></div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ============================================================================
   Living Glass Aquarium — one-file procedural Three.js aquarium
   Sections: utils / shared uniforms & GLSL / renderer / environment / tank /
   water optics / substrate / pebbles / filter / castle / plants / fish /
   crab / snails / loop
   ==========================================================================*/

const TANK = { w: 8, d: 4, h: 5.2, t: 0.06, water: 4.55 };
const INNER = { x: TANK.w / 2 - TANK.t, z: TANK.d / 2 - TANK.t };

const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const smoothstep = (e0, e1, x) => { const t = clamp((x - e0) / (e1 - e0), 0, 1); return t * t * (3 - 2 * t); };
const TAU = Math.PI * 2;
const FWD = new THREE.Vector3(1, 0, 0);

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const rng = mulberry32(20260418);
const rand = (a = 0, b = 1) => a + (b - a) * rng();
const randInt = (a, b) => Math.floor(rand(a, b + 1));
const pick = (arr) => arr[Math.floor(rng() * arr.length)];

function hash2(x, y) { const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453123; return s - Math.floor(s); }
function vnoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash2(xi, yi), b = hash2(xi + 1, yi), c = hash2(xi, yi + 1), d = hash2(xi + 1, yi + 1);
  return lerp(lerp(a, b, u), lerp(c, d, u), v);
}
function fbm(x, y, oct = 4) { let s = 0, a = 0.5, f = 1; for (let i = 0; i < oct; i++) { s += a * vnoise(x * f, y * f); a *= 0.5; f *= 2; } return s; }

function makeCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function canvasTexture(c, { srgb = true, repeat = [1, 1], wrap = THREE.RepeatWrapping, aniso = 8 } = {}) {
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = srgb ? THREE.SRGBColorSpace : THREE.NoColorSpace;
  t.wrapS = t.wrapT = wrap;
  t.repeat.set(repeat[0], repeat[1]);
  t.anisotropy = aniso;
  t.needsUpdate = true;
  return t;
}
function radialSprite(size = 64) {
  const c = makeCanvas(size, size), g = c.getContext('2d');
  const gr = g.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
  gr.addColorStop(0, 'rgba(255,255,255,1)');
  gr.addColorStop(0.35, 'rgba(255,255,255,.55)');
  gr.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = gr; g.fillRect(0, 0, size, size);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}

/* ---------------------------------------------------------------- uniforms */
const U = {
  uTime: { value: 0 },
  uWaterLevel: { value: TANK.water },
  uCaustic: { value: 0.3 },
  uScreen: { value: new THREE.Vector2(1, 1) },
  uScene: { value: null },
  uDepth: { value: null },
  uRipples: { value: Array.from({ length: 16 }, () => new THREE.Vector4(0, 0, 0, 0)) },
  tEnv: { value: null },
};

/* ------------------------------------------------------------- GLSL library */
const GLSL_ENV = /* glsl */`
uniform float uWaterLevel;
uniform float uCaustic;
vec2 equirectDir(vec3 d){
  float u = atan(d.z, d.x) * 0.15915494 + 0.5;
  float v = asin(clamp(d.y, -1.0, 1.0)) * 0.31830989 + 0.5;
  return vec2(u, v);
}
float hash21(vec2 p){ p = fract(p * vec2(127.31, 311.7)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
float causticCell(vec2 uv, float t){
  vec2 i = floor(uv), f = fract(uv);
  float d = 1.0;
  for (int y = -1; y <= 1; y++){
    for (int x = -1; x <= 1; x++){
      vec2 g = vec2(float(x), float(y));
      vec2 id = i + g;
      vec2 o = vec2(hash21(id), hash21(id + 17.13));
      o = 0.5 + 0.42 * sin(6.2831853 * o + t);
      d = min(d, length(g + o - f));
    }
  }
  return d;
}
`;


const GLSL_WAVE = /* glsl */`
uniform float uTime;
uniform vec4 uRipples[16];
float waveLayer(vec2 p, float t){
  float h = 0.0;
  h += sin(p.x * 2.1 + t * 0.62) * 0.0115;
  h += sin(p.y * 1.73 - t * 0.51 + 1.3) * 0.0095;
  h += sin((p.x * 1.13 + p.y * 0.87) * 1.9 + t * 0.44) * 0.0072;
  h += sin(p.x * 4.4 - p.y * 3.3 + t * 1.25) * 0.0036;
  h += sin(p.x * 7.7 + p.y * 6.1 - t * 1.9) * 0.0021;
  return h;
}
vec3 waveState(vec2 p, float t){
  float h = waveLayer(p, t);
  float dx = cos(p.x * 2.1 + t * 0.62) * 0.0115 * 2.1
    + cos((p.x * 1.13 + p.y * 0.87) * 1.9 + t * 0.44) * 0.0072 * 1.13 * 1.9
    + cos(p.x * 4.4 - p.y * 3.3 + t * 1.25) * 0.0036 * 4.4
    + cos(p.x * 7.7 + p.y * 6.1 - t * 1.9) * 0.0021 * 7.7;
  float dz = cos(p.y * 1.73 - t * 0.51 + 1.3) * 0.0095 * 1.73
    + cos((p.x * 1.13 + p.y * 0.87) * 1.9 + t * 0.44) * 0.0072 * 0.87 * 1.9
    - cos(p.x * 4.4 - p.y * 3.3 + t * 1.25) * 0.0036 * 3.3
    + cos(p.x * 7.7 + p.y * 6.1 - t * 1.9) * 0.0021 * 6.1;
  return vec3(h, dx, dz);
}
vec3 rippleLayer(vec2 p, float t){
  vec3 state = vec3(0.0);
  for (int i = 0; i < 16; i++){
    vec4 r = uRipples[i];
    float age = t - r.z;
    if (r.w <= 0.0 || age < 0.0 || age > 3.4) continue;
    vec2 delta = p - r.xy;
    float dist = length(delta);
    float dd = dist - age * 0.72;
    float envelope = exp(-dd * dd * 18.0) * exp(-age * 0.95)
      * smoothstep(0.0, 0.09, age) * (1.0 - smoothstep(2.7, 3.4, age));
    float carrier = sin(dd * 24.0);
    float amplitude = r.w * 0.009;
    state.x += amplitude * envelope * carrier;
    float derivative = amplitude * envelope * (24.0 * cos(dd * 24.0) - 36.0 * dd * carrier);
    state.yz += derivative * delta / max(dist, 0.0001);
  }
  return state;
}
vec3 waterState(vec2 p, float t){ return waveState(p, t) + rippleLayer(p, t); }
float waterHeight(vec2 p, float t){ return waterState(p, t).x; }

`;

const GLSL_CAUSTIC = GLSL_ENV + GLSL_WAVE + /* glsl */`
float causticFactor(vec3 w, float t, float depthScale){
  float depth = max(0.0, uWaterLevel - w.y);
  float atten = exp(-depth * depthScale);
  if (atten < 0.01) return 1.0;
  vec2 p = w.xz;
  vec2 drift = vec2(t * 0.035, -t * 0.028);
  float d1 = causticCell(p * 2.1 + drift, t * 0.55);
  float d2 = causticCell(p * 3.9 - drift * 1.7, t * 0.4);
  float c1 = pow(clamp(1.0 - d1 * 1.15, 0.0, 1.0), 5.0);
  float c2 = pow(clamp(1.0 - d2 * 1.15, 0.0, 1.0), 8.0);
  float focus = waveLayer(p, t) * 6.0 + 1.0;
  float c = (c1 * 0.75 + c2 * 0.5) * clamp(focus, 0.45, 1.5);
  return mix(1.0, c * 1.25, uCaustic * atten);
}
`;


function applyCaustics(material, strength = 1.0, depthScale = 0.1) {
  material.onBeforeCompile = (shader) => {

    shader.uniforms.uTime = U.uTime;
    shader.uniforms.uRipples = U.uRipples;
    shader.uniforms.uWaterLevel = U.uWaterLevel;
    shader.uniforms.uCaustic = { value: strength };
    shader.uniforms.uDepthScale = { value: depthScale };
    shader.vertexShader = shader.vertexShader
      .replace('#include <common>', '#include <common>\nvarying vec3 vWPos;\nvarying float vDepthC;')
      .replace('#include <fog_vertex>', `#include <fog_vertex>
        vec4 wp4 = vec4(transformed, 1.0);
        #ifdef USE_INSTANCING
          wp4 = instanceMatrix * wp4;
        #endif
        vWPos = (modelMatrix * wp4).xyz;
        vDepthC = -mvPosition.z;`);
    shader.fragmentShader = shader.fragmentShader
      .replace('#include <common>', `#include <common>
        uniform float uDepthScale;
        varying vec3 vWPos;
        varying float vDepthC;
        ${GLSL_CAUSTIC}`)
      .replace('#include <opaque_fragment>', `#include <opaque_fragment>
        {
          float ca = causticFactor(vWPos, uTime, uDepthScale);
          gl_FragColor.rgb *= ca;
          float dk = clamp((vDepthC - 3.2) * 0.05, 0.0, 0.34);
          gl_FragColor.rgb = mix(gl_FragColor.rgb, gl_FragColor.rgb * vec3(0.66, 0.87, 1.03), dk);
        }`);
  };
  material.customProgramCacheKey = () => 'caustics';
  return material;
}

/* ---------------------------------------------------------------- renderer */
const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.22;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.shadowMap.autoUpdate = false;
renderer.outputColorSpace = THREE.SRGBColorSpace;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0d222f);

const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 120);
const HOME_POS = new THREE.Vector3(2.35, 3.45, 8.55);
const HOME_TARGET = new THREE.Vector3(0, 1.95, 0);
camera.position.copy(HOME_POS);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.copy(HOME_TARGET);
controls.enableDamping = true;
controls.dampingFactor = 0.075;
controls.rotateSpeed = 0.75;
controls.panSpeed = 0.6;
controls.zoomSpeed = 0.8;
controls.minDistance = 4.2;
controls.maxDistance = 19;
controls.minPolarAngle = 0.12;
controls.maxPolarAngle = Math.PI * 0.495;
controls.update();

/* ------------------------------------------------------------ environment */
function buildEnvironment() {
  const c = makeCanvas(1024, 512), g = c.getContext('2d');
  const sky = g.createLinearGradient(0, 0, 0, 512);
  sky.addColorStop(0.00, '#dfeff4');
  sky.addColorStop(0.30, '#8fb9c4');
  sky.addColorStop(0.52, '#2c5c6f');
  sky.addColorStop(0.74, '#123744');
  sky.addColorStop(1.00, '#0a1a24');
  g.fillStyle = sky; g.fillRect(0, 0, 1024, 512);

  g.globalCompositeOperation = 'lighter';
  const blobs = [[210, 90, 190, 'rgba(255,252,240,.95)'], [700, 130, 150, 'rgba(190,225,235,.5)'],
                 [880, 60, 120, 'rgba(255,255,255,.45)'], [470, 330, 260, 'rgba(40,110,130,.35)']];
  for (const [x, y, r, col] of blobs) {
    const gr = g.createRadialGradient(x, y, 0, x, y, r);
    gr.addColorStop(0, col); gr.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = gr; g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill();
  }
  g.globalCompositeOperation = 'source-over';
  for (let i = 0; i < 26; i++) {
    g.fillStyle = `rgba(220,245,255,${0.02 + rng() * 0.03})`;
    g.fillRect(0, Math.floor(rng() * 512), 1024, 1);
  }
  const tex = new THREE.CanvasTexture(c);
  tex.mapping = THREE.EquirectangularReflectionMapping;
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.wrapS = THREE.RepeatWrapping;
  tex.needsUpdate = true;

  const pmrem = new THREE.PMREMGenerator(renderer);
  const envMap = pmrem.fromEquirectangular(tex).texture;
  scene.environment = envMap;
  pmrem.dispose();
  U.tEnv.value = tex;
  return tex;
}
const envTex = buildEnvironment();

/* ------------------------------------------------------ render targets */
function makeRT(w, h, withDepth) {
  const rt = new THREE.WebGLRenderTarget(w, h, {
    type: THREE.HalfFloatType,
    minFilter: THREE.LinearFilter,
    magFilter: THREE.LinearFilter,
    depthBuffer: true,
    generateMipmaps: false,
  });
  if (withDepth) {
    const d = new THREE.DepthTexture(w, h);
    d.type = THREE.UnsignedIntType;
    d.minFilter = THREE.NearestFilter;
    d.magFilter = THREE.NearestFilter;
    rt.depthTexture = d;
  }
  return rt;
}
let rtBase = null, rtGlass = null;
let rtScale = 0.85;

function resizeTargets() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = Math.max(2, Math.floor(window.innerWidth * dpr * rtScale));
  const h = Math.max(2, Math.floor(window.innerHeight * dpr * rtScale));
  if (rtBase) rtBase.dispose();
  if (rtGlass) rtGlass.dispose();
  rtBase = makeRT(w, h, true);
  rtGlass = makeRT(w, h, false);
  U.uScene.value = rtBase.texture;
  U.uDepth.value = rtBase.depthTexture;
}

/* ------------------------------------------------------------------ light */
const hemi = new THREE.HemisphereLight(0xcfeef6, 0x1a3a46, 0.9);
scene.add(hemi);
const ambient = new THREE.AmbientLight(0xb6dfee, 0.55);
scene.add(ambient);

const keyLight = new THREE.DirectionalLight(0xfff6e8, 3.9);
keyLight.position.set(2.4, 9.5, 3.2);
keyLight.target.position.set(0, 1.6, 0);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(1024, 1024);
keyLight.shadow.camera.near = 4;
keyLight.shadow.camera.far = 22;
keyLight.shadow.camera.left = -5.6;
keyLight.shadow.camera.right = 5.6;
keyLight.shadow.camera.top = 4.6;
keyLight.shadow.camera.bottom = -4.6;
keyLight.shadow.bias = -0.0012;
keyLight.shadow.normalBias = 0.028;
keyLight.shadow.radius = 2.4;
scene.add(keyLight, keyLight.target);

const fillLight = new THREE.DirectionalLight(0xa8dcf0, 1.05);
fillLight.position.set(-4.5, 4.2, 5.5);
scene.add(fillLight);
const rimLight = new THREE.DirectionalLight(0x7ab8d2, 0.75);
rimLight.position.set(0, 3.0, -6);
scene.add(rimLight);

const LIGHT_BAR = { center: new THREE.Vector3(0, TANK.h + 0.38, -0.25), halfSize: new THREE.Vector2(2.8, 0.13) };
const lightBarGroup = new THREE.Group();
lightBarGroup.name = 'slim-led-light';
{
  const housingMat = new THREE.MeshStandardMaterial({ color: 0x141a1e, roughness: 0.42, metalness: 0.65 });
  const housing = new THREE.Mesh(new THREE.BoxGeometry(5.85, 0.105, 0.32), housingMat);
  housing.position.copy(LIGHT_BAR.center); housing.position.y += 0.062;
  housing.castShadow = true; lightBarGroup.add(housing);
  // A narrow downward-facing diffuser; the top and sides stay matte black.
  const diffuser = new THREE.Mesh(new THREE.PlaneGeometry(5.6, 0.26), new THREE.MeshBasicMaterial({ color: 0xe8f4f0 }));
  diffuser.rotation.x = Math.PI / 2; diffuser.position.copy(LIGHT_BAR.center);
  lightBarGroup.add(diffuser);
  for (const side of [-1, 1]) {
    const support = new THREE.Mesh(new THREE.BoxGeometry(0.075, 0.42, 0.14), housingMat);
    support.position.set(side * 3.83, TANK.h + 0.18, -0.25);
    const arm = new THREE.Mesh(new THREE.BoxGeometry(1.15, 0.055, 0.14), housingMat);
    arm.position.set(side * 3.29, LIGHT_BAR.center.y + 0.015, -0.25);
    const clip = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.075, 0.23), housingMat);
    clip.position.set(side * 3.83, TANK.h - 0.015, -0.25);
    lightBarGroup.add(support, arm, clip);
  }
}
scene.add(lightBarGroup);

/* ==========================================================================
   STAGE 1 — tank shell, glass panes, frame, pedestal
   ==========================================================================*/
const tankRoot = new THREE.Group();
scene.add(tankRoot);

const glassMaterial = (() => {
  const m = new THREE.ShaderMaterial({
    uniforms: {
      uTime: U.uTime, uScreen: U.uScreen, tScene: { value: null }, tEnv: U.tEnv,
      uRefrac: { value: 0.055 }, uReflect: { value: 0.62 }, uTint: { value: new THREE.Color(0xcfeeff) },
    },
    vertexShader: /* glsl */`
      varying vec3 vWorld; varying vec3 vNrm; varying vec3 vLocal;
      void main(){
        vLocal = position;
        vec4 wp = modelMatrix * vec4(position, 1.0);
        vWorld = wp.xyz;
        vNrm = normalize(mat3(modelMatrix) * normal);
        gl_Position = projectionMatrix * viewMatrix * wp;
      }`,
    fragmentShader: /* glsl */`
      uniform vec2 uScreen; uniform sampler2D tScene; uniform sampler2D tEnv;
      uniform float uRefrac; uniform float uReflect; uniform vec3 uTint;
      varying vec3 vWorld; varying vec3 vNrm; varying vec3 vLocal;
      ${GLSL_ENV}
      void main(){
        vec3 N = normalize(vNrm);
        if (!gl_FrontFacing) N = -N;
        vec3 V = normalize(cameraPosition - vWorld);
        float ndv = clamp(dot(N, V), 0.0, 1.0);
        float f = pow(1.0 - ndv, 4.0);
        float fres = mix(0.025, 1.0, f);
        vec2 suv = gl_FragCoord.xy / uScreen;
        vec3 nv = normalize((viewMatrix * vec4(N, 0.0)).xyz);
        float dist = length(cameraPosition - vWorld);
        vec2 off = nv.xy * (uRefrac / (1.0 + dist * 0.30));
        vec2 uvR = clamp(suv + off, vec2(0.002), vec2(0.998));
        vec3 col = texture2D(tScene, uvR).rgb;

        vec3 R = reflect(-V, N);
        vec3 refl = texture2D(tEnv, equirectDir(R)).rgb;
        vec3 L = normalize(vec3(0.35, 1.0, 0.5));
        float spec = pow(max(dot(N, normalize(L + V)), 0.0), 420.0);
        col += vec3(1.0, 0.98, 0.93) * spec * 1.15;

        vec3 tinted = col * mix(vec3(1.0), vec3(0.74, 0.93, 1.0), f * 0.85) + uTint * f * 0.035;
        vec3 outc = mix(tinted, refl, clamp(fres * uReflect, 0.0, 0.92));
        float alpha = clamp(0.055 + f * 0.55 + spec * 0.5, 0.0, 0.95);
        gl_FragColor = vec4(outc, alpha);
        #include <tonemapping_fragment>
        #include <colorspace_fragment>
      }`,
    transparent: true,
    depthWrite: false,
    side: THREE.DoubleSide,
  });
  return m;
})();

const tankGlass = new THREE.Group();
tankRoot.add(tankGlass);
{
  const t = TANK.t;
  const hw = TANK.w / 2, hd = TANK.d / 2;
  const panes = [
    { name: 'front', size: [TANK.w, TANK.h], pos: [0, TANK.h / 2, hd] },
    { name: 'back', size: [TANK.w, TANK.h], pos: [0, TANK.h / 2, -hd] },
    { name: 'right', size: [TANK.d, TANK.h], pos: [hw, TANK.h / 2, 0] },
    { name: 'left', size: [TANK.d, TANK.h], pos: [-hw, TANK.h / 2, 0] },

      const a = i * (segsV + 1) + j, b = a + 1, c2 = a + segsV + 1, d = c2 + 1;
      idx.push(a, c2, b, b, c2, d);
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  g.setAttribute('aT', new THREE.Float32BufferAttribute(aT, 1));
  g.setAttribute('aAcross', new THREE.Float32BufferAttribute(aAcross, 1));
  g.setAttribute('aPhase', new THREE.Float32BufferAttribute(aPhase, 1));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}
const finBaseCache = new WeakMap();
function registerFinDeform(mesh, { amp = 0.05, freq = 6, delay = 0.6, tipBias = 2.0 }) {
  const geo = mesh.geometry;
  if (!finBaseCache.has(geo)) finBaseCache.set(geo, { base: new Float32Array(geo.attributes.position.array), aT: geo.attributes.aT.array, aAcross: geo.attributes.aAcross.array, aPhase: geo.attributes.aPhase.array });
  const { base, aT, aAcross, aPhase } = finBaseCache.get(geo);
  const pos = geo.attributes.position.array;
  mesh.userData.finDeform = (t, effort) => {
    const A = amp * (0.3 + effort * 1.1);
    for (let i = 0; i < aT.length; i++) {
      const u = aT[i], ac = aAcross[i], ph = aPhase[i];
      const k = i * 3;
      const edge = Math.pow(u, tipBias);
      const w = Math.sin(t * freq - u * delay * 3.0 + ph * 2.2) * A * edge;
      const w2 = Math.cos(t * freq * 0.8 - u * delay * 2.4 + ph * 1.7) * A * edge * 0.6;
      pos[k] = base[k] - w * 0.9;
      pos[k + 1] = base[k + 1] + w2;
      pos[k + 2] = base[k + 2] + w * ac * 0.55;
    }
    geo.attributes.position.needsUpdate = true;
    geo.computeVertexNormals();
  };
  return mesh;
}
function finMaterial(tex, { color = 0xffffff, opacity = 0.92, emissive = 0x000000, ei = 0.0, rough = 0.42 } = {}) {
  return applyCaustics(new THREE.MeshStandardMaterial({
    color, map: tex, transparent: true, opacity, roughness: rough, metalness: 0.04,
    side: THREE.DoubleSide, depthWrite: false, emissive, emissiveIntensity: ei,
  }), 0.3, 0.1);
}
function addEyes(group, { x, y, z, r = 0.032, mat, hi }) {
  for (const s of [-1, 1]) {
    const eye = new THREE.Mesh(new THREE.SphereGeometry(r, 14, 10), mat);
    eye.position.set(x, y, s * z);
    group.add(eye);
    const pupil = new THREE.Mesh(new THREE.SphereGeometry(r * 0.55, 12, 8),
      new THREE.MeshStandardMaterial({ color: 0x05070a, roughness: 0.25, metalness: 0.1 }));
    pupil.position.set(x - r * 0.45, y + r * 0.1, s * z * 0.82);
    group.add(pupil);
    const spec = new THREE.Mesh(new THREE.SphereGeometry(r * 0.2, 8, 6), hi);
    spec.position.set(x - r * 0.55, y + r * 0.42, s * z * 0.62);
    group.add(spec);
  }
}
function addGillLines(group, { x, y, z, r, mat }) {
  for (const s of [-1, 1]) {
    const g = new THREE.Mesh(new THREE.TorusGeometry(r, 0.006, 6, 14, Math.PI * 0.85), mat);
    g.position.set(x, y, s * z);
    g.rotation.set(Math.PI / 2, 0, s > 0 ? -0.4 : Math.PI + 0.4);
    group.add(g);
  }
}

/* ---- Fish 1: fancy guppy ---- */
function createGuppy() {
  const group = new THREE.Group();
  const L = 0.82;
  const body = buildFishBodyGeometry({
    length: L,
    halfW: (t) => 0.072 * Math.pow(Math.sin(Math.PI * Math.pow(t, 0.63)), 0.78),

  const bodyMat = applyCaustics(new THREE.MeshStandardMaterial({

    emissive: 0x0a3a4a, emissiveIntensity: 0.25,
  }), 0.3, 0.1);
  const bodyMesh = new THREE.Mesh(body, bodyMat);
  bodyMesh.castShadow = true;
  group.add(bodyMesh);
  registerBodyDeform(bodyMesh, { amp: 0.2, freq: 7.5 });

  const tailTex = finTexture({ base: '#f2a03a', edge: '#d94f1e', rays: 'rgba(90,30,10,.5)', cols: 9, alphaEdge: 0.4 });
  const tailGeo = buildFinGeometry({
    length: 0.4, span: (u) => 0.05 + 0.36 * Math.pow(u, 1.35), rise: 0.2, cup: 0.2, segsU: 11, segsV: 9,
  });
  const tail = new THREE.Mesh(tailGeo, finMaterial(tailTex, { color: 0xffc890 }));
  tail.position.set(-L + 0.01, 0.012, 0);
  tail.renderOrder = 4;
  group.add(tail);
  registerFinDeform(tail, { amp: 0.075, freq: 7.0, delay: 0.5, tipBias: 1.6 });

  const dorsalGeo = buildFinGeometry({ length: 0.17, span: (u) => 0.02 + 0.1 * Math.pow(u, 0.7), rise: 0.1, segsU: 7, segsV: 6 });
  const dorsal = new THREE.Mesh(dorsalGeo, finMaterial(finTexture({ base: '#f2b070', edge: '#e07a30', cols: 6 }), { color: 0xffd8b0 }));
  dorsal.position.set(-L * 0.42, 0.055, 0);

  dorsal.renderOrder = 4;
  group.add(dorsal);
  registerFinDeform(dorsal, { amp: 0.03, freq: 6.5 });

  const analGeo = buildFinGeometry({ length: 0.14, span: (u) => 0.015 + 0.075 * Math.pow(u, 0.8), rise: 0.1, segsU: 6, segsV: 5 });
  const anal = new THREE.Mesh(analGeo, finMaterial(tailTex, { color: 0xffc890 }));
  anal.position.set(-L * 0.82, -0.03, 0);
  anal.rotation.z = Math.PI / 2 + 0.25;
  anal.renderOrder = 4;
  group.add(anal);
  registerFinDeform(anal, { amp: 0.025, freq: 6.0 });

  const pecGeo = buildFinGeometry({ length: 0.13, span: (u) => 0.01 + 0.075 * Math.pow(u, 0.9), rise: 0.2, segsU: 6, segsV: 5 });
  const pecMat = finMaterial(finTexture({ base: '#cfe9f2', edge: '#9fd0e0', cols: 4, alphaEdge: 0.45 }), { color: 0xdff2f8, opacity: 0.72 });
  for (const s of [-1, 1]) {
    const pec = new THREE.Mesh(pecGeo, pecMat);
    pec.position.set(-L * 0.22, -0.005, s * 0.05);
    pec.rotation.set(0.3, s * 0.9, s * 0.5 + Math.PI / 2);
    pec.renderOrder = 4;
    group.add(pec);
    registerFinDeform(pec, { amp: 0.05, freq: 11.0, delay: 0.1 });
    pec.userData.pec = s;
  }
  const ventralGeo = buildFinGeometry({ length: 0.1, span: (u) => 0.008 + 0.05 * Math.pow(u, 0.9), rise: 0.2, segsU: 5, segsV: 4 });
  for (const s of [-1, 1]) {
    const v = new THREE.Mesh(ventralGeo, finMaterial(tailTex, { color: 0xffc890 }));
    v.position.set(-L * 0.6, -0.035, s * 0.028);
    v.rotation.z = Math.PI / 2 + 0.5 * s;
    v.renderOrder = 4;
    group.add(v);
    registerFinDeform(v, { amp: 0.03, freq: 6.2 });

  addEyes(group, { x: -0.045, y: 0.035, z: 0.048, r: 0.031, mat: eyeMat });
  addGillLines(group, { x: -L * 0.17, y: 0.0, z: 0.062, r: 0.045, mat: darkLineMat });
  const mouth = new THREE.Mesh(new THREE.SphereGeometry(0.016, 8, 6), darkLineMat);
  mouth.position.set(0.0, -0.012, 0);
  mouth.scale.set(0.7, 0.6, 1.1);
  group.add(mouth);

  group.userData.fins = [tail, dorsal, anal];
  group.userData.pectorals = group.children.filter((c) => c.userData.pec);
  return { group, length: L, height: 0.3, radius: 0.3, tailYawOf: () => bodyMesh.userData.tailYaw || 0 };

const snailA = buildSnail({

const snailA_AI = { pos: new THREE.Vector3(-0.7, 0, 1.55), heading: Math.PI / 2,

function updateSnails(dt, t) {
  const a = snailA_AI;
  _s1.set(a.target.x - a.pos.x, 0, a.target.z - a.pos.z);
  if (_s1.length() < 0.12) a.target.set(rand(-2.3, 1.4), 0, rand(0.95, 1.52));

function onResize() {
  const w = window.innerWidth, h = window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(w, h);
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const rw = Math.max(2, Math.floor(w * dpr * rtScale));
  const rh = Math.max(2, Math.floor(h * dpr * rtScale));
  rtBase.setSize(rw, rh);
  rtGlass.setSize(rw, rh);
  U.uScreen.value.set(w * dpr, h * dpr);
}

const refractive = [waterSurface, waterVolume];

function renderScene() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = window.innerWidth * dpr, h = window.innerHeight * dpr;

  /* pass 1: opaque scene without any refractive surface */
  U.uScreen.value.set(rtBase.width, rtBase.height);
  waterSurface.visible = false; waterVolume.visible = false;
  for (const g of glassMeshes) g.visible = false;
  waterSurfaceMat.uniforms.tScene.value = rtBase.texture;
  waterSurfaceMat.uniforms.tDepth.value = rtBase.depthTexture;
  glassMaterial.uniforms.tScene.value = rtGlass.texture;
  renderer.setRenderTarget(rtBase);
  renderer.clear();
  renderer.render(scene, camera);

  /* pass 2: add water (refracting the base pass) for the glass to distort */

  waterVolume.visible = true;
  for (const g of glassMeshes) g.visible = false;
  U.uScreen.value.set(rtGlass.width, rtGlass.height);
  renderer.setRenderTarget(rtGlass);
  renderer.clear();
  renderer.render(scene, camera);

  /* pass 3: final composite */
  for (const g of glassMeshes) g.visible = true;
  U.uScreen.value.set(w, h);
  renderer.setRenderTarget(null);
  renderer.render(scene, camera);

const plantDeformTargets = [vallisneria, anubias, javaFern, cabomba].map((g) => {
  const meshes = [];
  g.traverse((o) => { if (o.userData && o.userData.deform) meshes.push(o); });

let lastTime = performance.now();

function animate() {
  const now = performance.now();
  let dt = (now - lastTime) / 1000;

  if (!paused) {
    simTime += dt;
    U.uTime.value = simTime;
    for (const p of plantDeformTargets) {
      if (!p.meshes.length) continue;
      const cur = current.at(p.pos.x, p.pos.y + 1.0, p.pos.z, simTime);
      for (const m of p.meshes) m.userData.deform(simTime, cur);
